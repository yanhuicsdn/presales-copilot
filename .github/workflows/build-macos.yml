name: Build macOS App (Apple Silicon)

on:
  push:
    branches: [main, master]
    paths:
      - 'macos/**'
      - '.github/workflows/build-macos.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Test & Build PreSalesCopilot.app (macOS arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Swift & macOS toolchain versions
        run: |
          sw_vers
          swift --version
          uname -m

      - name: Download official Sherpa-ONNX v2.0.3 macOS xcframework
        working-directory: macos
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          curl -fsSL -o /tmp/sherpa-macos.zip \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v2.0.3-macos-shared-onnxruntime-static.xcframework.zip"
          unzip -q -o /tmp/sherpa-macos.zip -d Frameworks
          rm -f /tmp/sherpa-macos.zip
          ls -lh Frameworks/sherpa-onnx.xcframework/macos-arm64_x86_64/

      - name: Run PreSalesCore unit tests (swift test with native Sherpa-ONNX)
        working-directory: macos
        env:
          EXPECT_NATIVE_SHERPA: "1"
        run: |
          DYLD_LIBRARY_PATH="$(pwd)/Frameworks/sherpa-onnx.xcframework/macos-arm64_x86_64" \
            swift test --verbose

      - name: Build release binary (Apple Silicon arm64)
        working-directory: macos
        run: swift build -c release --arch arm64

      - name: Package PreSalesCopilot.app bundle, ZIP & DMG
        working-directory: macos
        run: |
          set -euo pipefail
          BIN_PATH="$(swift build -c release --arch arm64 --show-bin-path)/PreSalesCopilot"
          APP_DIR="dist/PreSalesCopilot.app"
          rm -rf dist
          mkdir -p "${APP_DIR}/Contents/MacOS" "${APP_DIR}/Contents/Resources" "${APP_DIR}/Contents/Frameworks"

          cp "${BIN_PATH}" "${APP_DIR}/Contents/MacOS/PreSalesCopilot"
          chmod +x "${APP_DIR}/Contents/MacOS/PreSalesCopilot"

          # Embed arm64-thinned libsherpa-onnx-c-api.dylib (with static ONNX Runtime inside)
          lipo -thin arm64 \
            "Frameworks/sherpa-onnx.xcframework/macos-arm64_x86_64/libsherpa-onnx-c-api.dylib" \
            -output "${APP_DIR}/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          install_name_tool -id "@rpath/libsherpa-onnx-c-api.dylib" \
            "${APP_DIR}/Contents/Frameworks/libsherpa-onnx-c-api.dylib"

          OLD_DEP=$(otool -L "${APP_DIR}/Contents/MacOS/PreSalesCopilot" | awk '/libsherpa-onnx-c-api\.dylib/{print $1}' | head -n 1 || true)
          if [ -n "${OLD_DEP}" ] && [ "${OLD_DEP}" != "@rpath/libsherpa-onnx-c-api.dylib" ]; then
            install_name_tool -change "${OLD_DEP}" "@rpath/libsherpa-onnx-c-api.dylib" "${APP_DIR}/Contents/MacOS/PreSalesCopilot"
          fi
          install_name_tool -add_rpath "@executable_path/../Frameworks" "${APP_DIR}/Contents/MacOS/PreSalesCopilot" 2>/dev/null || true

          echo "=== Verifying dynamic library linkage ==="
          otool -L "${APP_DIR}/Contents/MacOS/PreSalesCopilot"

          cat > "${APP_DIR}/Contents/PkgInfo" <<'EOF'
          APPL????
          EOF

          cat > "${APP_DIR}/Contents/Info.plist" <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>zh_CN</string>
            <key>CFBundleDisplayName</key>
            <string>售前智问分身</string>
            <key>CFBundleExecutable</key>
            <string>PreSalesCopilot</string>
            <key>CFBundleIdentifier</key>
            <string>com.presalescopilot.macos</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>PreSalesCopilot</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>2.1.0</string>
            <key>CFBundleVersion</key>
            <string>3</string>
            <key>LSMinimumSystemVersion</key>
            <string>14.0</string>
            <key>NSHighResolutionCapable</key>
            <true/>
            <key>NSMicrophoneUsageDescription</key>
            <string>售前智问分身需要访问麦克风以在 Mac 本地完成静默语音转写，原始音频绝不离开本机。</string>
            <key>NSSpeechRecognitionUsageDescription</key>
            <string>售前智问分身使用端侧语音识别将现场沟通转为文字，音频全程保留在本地。</string>
          </dict>
          </plist>
          EOF

          # Ad-hoc code sign embedded framework first, then app bundle
          codesign --force --sign - "${APP_DIR}/Contents/Frameworks/libsherpa-onnx-c-api.dylib"
          codesign --force --deep --sign - "${APP_DIR}"
          codesign --verify --deep --strict --verbose=2 "${APP_DIR}"

          # Package ZIP
          (cd dist && ditto -c -k --sequesterRsrc --keepParent PreSalesCopilot.app PreSalesCopilot-macOS-arm64.zip)

          # Package DMG
          hdiutil create -volname "PreSalesCopilot" \
            -srcfolder "${APP_DIR}" \
            -ov -format UDZO \
            "dist/PreSalesCopilot-macOS-arm64.dmg"

          ls -lh dist/

      - name: Upload macOS App Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PreSalesCopilot-macOS-arm64
          path: |
            macos/dist/PreSalesCopilot-macOS-arm64.zip
            macos/dist/PreSalesCopilot-macOS-arm64.dmg
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="macos-v2.1.${{ github.run_number }}"
          gh release create "${TAG}" \
            macos/dist/PreSalesCopilot-macOS-arm64.zip \
            macos/dist/PreSalesCopilot-macOS-arm64.dmg \
            --title "PreSales Copilot macOS v2.1.${{ github.run_number }} (内置 Sherpa-ONNX + 自动下载 SenseVoice)" \
            --notes "Apple Silicon (arm64) macOS 14+ 原生客户端 V2.1（方案 A）：已内置链接官方 Sherpa-ONNX v2.0.3 原生推理引擎，首次启动自动从国内镜像（HF-Mirror / HuggingFace）后台下载 int8 SenseVoice 模型并热切换；下载期间自动以 Apple 端侧离线语音兜底，原始音频 100% 保留本机。默认连接线上 V3.0 FDE 云端（https://presales.88886666.site）。"
