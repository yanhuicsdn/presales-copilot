name: Build iOS App (iPhone & iPad)

on:
  push:
    branches: [main, master]
    paths:
      - 'ios/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-ios:
    name: Test & Build PreSalesCopilotIOS (iOS 17+ arm64)
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download official Sherpa-ONNX v2.0.3 iOS xcframework
        working-directory: ios
        run: |
          set -euo pipefail
          mkdir -p Frameworks
          curl -fsSL -o /tmp/sherpa-ios.zip \
            "https://github.com/k2-fsa/sherpa-onnx/releases/download/xcframework/sherpa-onnx-v2.0.3-ios-shared-onnxruntime-static.xcframework.zip"
          unzip -q -o /tmp/sherpa-ios.zip -d Frameworks
          rm -f /tmp/sherpa-ios.zip
          ls -lh Frameworks/SherpaOnnxC.xcframework/

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Select available iPhone Simulator & run XCTest suite
        working-directory: ios
        run: |
          set -euo pipefail
          SIM_ID=$(xcrun simctl list devices available iPhone -j | python3 -c "
          import json, sys
          data = json.load(sys.stdin)
          for runtime, devs in sorted(data.get('devices', {}).items(), reverse=True):
              for d in devs:
                  if d.get('isAvailable') and 'iPhone' in d.get('name', ''):
                      print(d['udid'])
                      sys.exit(0)
          ")
          echo "Using iOS Simulator UDID: ${SIM_ID}"
          xcodebuild test \
            -project PreSalesCopilotIOS.xcodeproj \
            -scheme PreSalesCopilotIOS \
            -destination "platform=iOS Simulator,id=${SIM_ID}" \
            CODE_SIGNING_ALLOWED=NO

      - name: Build iOS arm64 Device Release App & Unsigned IPA
        working-directory: ios
        run: |
          set -euo pipefail
          xcodebuild build \
            -project PreSalesCopilotIOS.xcodeproj \
            -scheme PreSalesCopilotIOS \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/device \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

          APP_BUNDLE="build/device/Build/Products/Release-iphoneos/PreSalesCopilotIOS.app"
          if [ ! -d "${APP_BUNDLE}/Frameworks/SherpaOnnxC.framework" ]; then
            mkdir -p "${APP_BUNDLE}/Frameworks"
            cp -R "Frameworks/SherpaOnnxC.xcframework/ios-arm64/SherpaOnnxC.framework" "${APP_BUNDLE}/Frameworks/"
          fi
          echo "=== Verifying iOS SherpaOnnxC.framework linkage & embed ==="
          otool -L "${APP_BUNDLE}/PreSalesCopilotIOS" | grep -i sherpa || true
          ls -lh "${APP_BUNDLE}/Frameworks/SherpaOnnxC.framework/"

          mkdir -p dist/Payload
          cp -R "${APP_BUNDLE}" dist/Payload/
          (cd dist && zip -qr PreSalesCopilot-iOS-arm64.ipa Payload)
          rm -rf dist/Payload
          ls -lh dist/

      - name: Build iOS Simulator App Bundle
        working-directory: ios
        run: |
          set -euo pipefail
          OUT_ZIP="$(pwd)/dist/PreSalesCopilot-iOS-Simulator.zip"
          xcodebuild build \
            -project PreSalesCopilotIOS.xcodeproj \
            -scheme PreSalesCopilotIOS \
            -configuration Release \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath build/sim \
            CODE_SIGNING_ALLOWED=NO

          SIM_BUNDLE="build/sim/Build/Products/Release-iphonesimulator/PreSalesCopilotIOS.app"
          if [ ! -d "${SIM_BUNDLE}/Frameworks/SherpaOnnxC.framework" ]; then
            mkdir -p "${SIM_BUNDLE}/Frameworks"
            cp -R "Frameworks/SherpaOnnxC.xcframework/ios-arm64_x86_64-simulator/SherpaOnnxC.framework" "${SIM_BUNDLE}/Frameworks/"
          fi

          mkdir -p dist
          (cd build/sim/Build/Products/Release-iphonesimulator && ditto -c -k --sequesterRsrc --keepParent PreSalesCopilotIOS.app "${OUT_ZIP}")
          ls -lh dist/

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PreSalesCopilot-iOS
          path: |
            ios/dist/PreSalesCopilot-iOS-arm64.ipa
            ios/dist/PreSalesCopilot-iOS-Simulator.zip
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-v2.1.${{ github.run_number }}"
          gh release create "${TAG}" \
            ios/dist/PreSalesCopilot-iOS-arm64.ipa \
            ios/dist/PreSalesCopilot-iOS-Simulator.zip \
            --title "PreSales Copilot iOS v2.1.${{ github.run_number }} (内置 Sherpa-ONNX + 自动下载 SenseVoice)" \
            --notes "iOS 17+ (iPhone & iPad) 原生客户端 V2.1（方案 A）：已内置链接官方 Sherpa-ONNX v2.0.3 原生推理框架，首次启动自动从国内镜像（HF-Mirror / HuggingFace）后台下载 int8 SenseVoice 模型并热切换；下载期间自动以 Apple 端侧离线语音兜底，原始音频 100% 保留本机。默认连接线上 V3.0 FDE 云端（https://presales.88886666.site）。"
