name: PreSalesCopilotIOS
options:
  bundleIdPrefix: com.presalescopilot
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    MARKETING_VERSION: "2.1.0"
    CURRENT_PROJECT_VERSION: "3"

packages:
  PreSalesIOSKit:
    path: .

targets:
  PreSalesCopilotIOS:
    type: application
    platform: iOS
    sources:
      - path: Sources/PreSalesCopilotIOSApp
    dependencies:
      - package: PreSalesIOSKit
        product: PreSalesIOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presalescopilot.ios
        INFOPLIST_KEY_CFBundleDisplayName: "售前智问分身"
    info:
      path: Sources/PreSalesCopilotIOSApp/Info.plist
      properties:
        CFBundleDisplayName: "售前智问分身"
        CFBundleShortVersionString: "2.1.0"
        CFBundleVersion: "3"
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: "售前智问分身需要访问麦克风以在 iPhone 本地完成实时语音转写，原始音频绝不离开本机。"
        NSSpeechRecognitionUsageDescription: "售前智问分身使用端侧语音识别将现场沟通转为文字，音频全程保留在本地。"
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  PreSalesIOSCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/PreSalesIOSCoreTests
    dependencies:
      - target: PreSalesCopilotIOS
      - package: PreSalesIOSKit
        product: PreSalesIOSCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.presalescopilot.ios.tests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/PreSalesCopilotIOS.app/$(BUNDLE_EXECUTABLE_FOLDER_PATH)/PreSalesCopilotIOS"
        BUNDLE_LOADER: "$(TEST_HOST)"
